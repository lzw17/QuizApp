# 智题学习笔记 API 限流共享区
#
# 这些指令只能放在 Nginx 的 http 块中，不能直接放进宝塔站点的 server 配置。
# 推荐保存为：/www/server/nginx/conf/quizapp-rate-limit.conf
# 然后在 /www/server/nginx/conf/nginx.conf 的 http { ... } 内增加：
# include /www/server/nginx/conf/quizapp-rate-limit.conf;

limit_req_zone $binary_remote_addr zone=quiz_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=quiz_upload:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=quiz_api:10m rate=10r/s;
limit_req_status 429;
