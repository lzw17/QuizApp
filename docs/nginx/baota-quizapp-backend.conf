# 智题学习笔记 - 宝塔 Nginx 配置
#
# 部署方式：宝塔 Nginx + 宝塔 Python 项目，非 Docker。
# 服务器目标文件：
#   /www/server/panel/vhost/nginx/python_quizapp-backend.conf
# Python 后端仅监听：
#   127.0.0.1:8000
#
# 修改后必须先执行 `/www/server/nginx/sbin/nginx -t`，通过后再重载 Nginx。

server {
    listen 80;
    listen 443 ssl;
    # listen 443 quic;
    http2 on;
    server_name api.quizapp.chat;

    index index.html index.htm default.htm default.html;
    root /www/wwwroot/quizapp/backend;

    # 宝塔扩展配置与证书自动续签配置，请勿删除。
    include /www/server/panel/vhost/nginx/extension/quizapp-backend/*.conf;
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/quizapp-backend.conf;
    #CERT-APPLY-CHECK--END

    #HTTP_TO_HTTPS_START
    set $isRedcert 1;
    if ($server_port != 443) {
        set $isRedcert 2;
    }
    if ($uri ~ /\.well-known/) {
        set $isRedcert 1;
    }
    if ($isRedcert != 1) {
        rewrite ^(/.*)$ https://$host$1 permanent;
    }
    #HTTP_TO_HTTPS_END

    #SSL-START
    ssl_certificate /www/server/panel/vhost/cert/quizapp-backend/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/quizapp-backend/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;
    #SSL-END

    # 上传文档最大 50MB，Nginx 预留 10MB 余量。
    client_max_body_size 60m;

    gzip on;
    gzip_types application/json;

    # 宝塔伪静态配置，请保留文件；项目默认不需要额外伪静态规则。
    include /www/server/panel/vhost/rewrite/python_quizapp-backend.conf;

    # 禁止通过公网读取源码、版本库和生产配置。
    location ~* ^/(\.user\.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README\.md|package\.json|package-lock\.json|\.env) {
        return 404;
    }

    location ^~ /.well-known/ {
        root /www/wwwroot/java_node_ssl;
    }

    if ($uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$") {
        return 403;
    }

    # SSE 进度接口需要 HTTP/1.1 并关闭代理缓冲。
    location ~ ^/api/task/[^/]+/sse$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering "no" always;
    }

    # 登录和生成入口使用独立限流区。启用前必须先把同目录下
    # baota-http-rate-limit.conf 的内容安装到 Nginx http 块。
    location = /api/auth/login {
        limit_req zone=quiz_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ ^/api/upload(?:/url)?$ {
        limit_req zone=quiz_upload burst=2 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 普通 API 不是 WebSocket。不要设置 Upgrade，也不要把 Connection 设为 upgrade。
    location / {
        limit_req zone=quiz_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    access_log /www/wwwlogs/quizapp-backend.log;
    error_log /www/wwwlogs/quizapp-backend.error.log;
}
