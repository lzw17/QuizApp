# ============================================================
# 智题学习笔记（quizapp.chat）Nginx 配置
#
# 备案期间（ICP 备案审核中）：
#   80/443 端口不得通过域名对外提供网站内容。
#   方法一：先不要把本文件挂进容器（注释掉 docker-compose.yml 中
#           nginx 服务挂载 quizapp.conf 的那行），联调走 IP:8000。
#   方法二：取消下方 server 80 块中 return 444 的注释。
#
# 备案通过后：
#   1. 域名解析 A 记录指向本服务器公网 IP
#   2. 申请 SSL 证书，PEM/KEY 放到 deploy/certs/ 目录：
#        certs/api.quizapp.chat.pem
#        certs/api.quizapp.chat.key
#   3. 重载：docker compose exec nginx nginx -s reload
# ============================================================

# ---------- 80 端口：仅用于证书签发验证 + 跳转 HTTPS ----------
server {
    listen 80;
    server_name api.quizapp.chat quizapp.chat;

    # 备案期间取消下面一行的注释（拒绝所有请求）：
    # return 444;

    # Let's Encrypt / acme.sh HTTP-01 验证用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443 端口：正式对外（备案通过并拿到证书后启用） ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.quizapp.chat;

    ssl_certificate     /etc/nginx/certs/api.quizapp.chat.pem;
    ssl_certificate_key /etc/nginx/certs/api.quizapp.chat.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 小程序上传文档最大 50MB，留出余量
    client_max_body_size 60m;

    # gzip 压缩 JSON 接口
    gzip on;
    gzip_types application/json;

    # SSE 出题进度推送：必须关闭缓冲，否则进度卡住不刷新
    location ~ ^/api/task/[^/]+/sse$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 出题属于长任务，放宽超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
